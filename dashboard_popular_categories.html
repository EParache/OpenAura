
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Final - Contenedor Redondeado</title>
    <style>
        :root {
            --bg-page: #f0f2f5; /* Fondo gris de la página */
            --bg-panel: #ffffff; /* Fondo blanco del panel contenedor */
            --bg-sidebar: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --accent-1: #333333;
            --accent-2: #777777;
            --accent-3: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Barra Lateral */
        .sidebar {
            width: 80px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            z-index: 10;
        }

        .logo {
            width: 45px;
            height: 45px;
            background-color: #000;
            border-radius: 12px;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .nav-item {
            margin-bottom: 25px;
            color: #666;
            cursor: pointer;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: #f5f5f5;
        }

        .nav-item.active {
            background-color: #f0f0f0;
            color: #000;
        }

        .sidebar-footer {
            margin-top: auto;
            margin-bottom: 25px;
        }

        /* Área Principal */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 30px 30px 30px;
            overflow: hidden;
        }

        /* Encabezado */
        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            gap: 10px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notifications {
            position: relative;
            cursor: pointer;
        }

        .notif-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #000;
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 50%;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-info {
            text-align: right;
        }

        .profile-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .profile-role {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #ddd;
            border-radius: 50%;
        }

        /* EL PANEL CONTENEDOR (RECTÁNGULO REDONDEADO) */
        .content-panel {
            flex: 1;
            background-color: var(--bg-panel);
            border-radius: 24px; /* Bordes redondeados pronunciados */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 35px;
            overflow-y: auto;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Cuadrícula de Gráficos */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Tarjetas de Gráficos */
        .chart-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 18px;
            padding: 25px;
            transition: transform 0.2s;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-weight: 600;
            color: #444;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #666;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-1 { background-color: var(--accent-1); }
        .dot-2 { background-color: var(--accent-2); }
        .dot-3 { background-color: var(--accent-3); }

        .chart-svg-container {
            display: flex;
            justify-content: center;
        }

        .donut {
            transform: rotate(-90deg);
        }

        .donut-ring {
            fill: none;
            stroke-width: 5;
        }

        /* Segmentos dinámicos */
        .seg-1 { stroke: var(--accent-1); stroke-dasharray: 45 100; stroke-dashoffset: 0; }
        .seg-2 { stroke: var(--accent-2); stroke-dasharray: 30 100; stroke-dashoffset: -45; }
        .seg-3 { stroke: var(--accent-3); stroke-dasharray: 25 100; stroke-dashoffset: -75; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-wrapper { padding: 15px; }
            .brand { font-size: 1rem; }
            .profile-info { display: none; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <div class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="sidebar-footer nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M12 8l-4 8h8z"/></svg>
                <span>Dashboard Pro</span>
            </div>
            <div class="user-section">
                <div class="notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-badge">3</span>
                </div>
                <div class="profile">
                    <div class="profile-info">
                        <p class="profile-name">Renee McKelvey</p>
                        <p class="profile-role">Product Manager</p>
                    </div>
                    <div class="avatar"></div>
                </div>
            </div>
        </header>

        <div class="content-panel">
            <div class="dashboard-grid" id="grid">
                <!-- Se generarán 6 tarjetas dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        for (let i = 0; i < 6; i++) {
            grid.innerHTML += `
                <div class="chart-card">
                    <div class="card-top">
                        <span class="card-title">Popular Categories</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                    </div>
                    <div class="legend">
                        <div class="legend-item"><span class="dot dot-1"></span> Electronics</div>
                        <div class="legend-item"><span class="dot dot-2"></span> Furniture</div>
                        <div class="legend-item"><span class="dot dot-3"></span> Toys</div>
                    </div>
                    <div class="chart-svg-container">
                        <svg width="160" height="160" viewBox="0 0 42 42" class="donut">
                            <circle class="donut-ring seg-1" cx="21" cy="21" r="15.915"></circle>
                            <circle class="donut-ring seg-2" cx="21" cy="21" r="15.915"></circle>
                            <circle class="donut-ring seg-3" cx="21" cy="21" r="15.915"></circle>
                        </svg>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
